<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create an Account</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #181818;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      background-color: #ffffff;
      width: 100%;
      max-width: 420px;
      border-radius: 36px;
      padding: 44px 36px;
      color: #111111;
    }

    h1 {
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 26px;
    }

    .btn-google {
      width: 100%;
      padding: 13px 0;
      background-color: #222222;
      color: #ffffff;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      margin-bottom: 22px;
    }

    .divider {
      display: flex;
      align-items: center;
      text-align: center;
      color: #333333;
      font-size: 14px;
      margin-bottom: 22px;
    }

    .divider::before,
    .divider::after {
      content: "";
      flex: 1;
      border-bottom: 1px solid #cccccc;
    }

    .divider span {
      padding: 0 14px;
    }

    .field {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 14px;
      color: #222222;
      margin-bottom: 6px;
    }

    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: 12px 16px;
      background-color: #dcdcdc;
      border: 1.5px solid #333333;
      border-radius: 10px;
      font-size: 14px;
      color: #111111;
      outline: none;
    }

    input::placeholder {
      color: #555555;
    }

    .btn-primary {
      display: block;
      width: 185px;
      margin: 22px auto 20px auto;
      padding: 12px 0;
      background-color: #222222;
      color: #ffffff;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
    }

    .btn-primary:hover {
      background-color: #000000;
    }

    .terms {
      text-align: center;
      font-size: 13px;
      color: #333333;
      line-height: 1.45;
      margin-bottom: 22px;
    }

    .terms a {
      color: #222222;
      text-decoration: underline;
    }

    .footer-text {
      text-align: center;
      font-size: 14px;
      color: #555555;
    }

    .footer-text a {
      color: #555555;
      text-decoration: underline;
    }

    .error-banner {
      background-color: #fde8e8;
      color: #9b1c1c;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Create an Account</h1>

    <button type="button" class="btn-google">Continue with Google</button>

    <div class="divider"><span>or</span></div>

    {% if messages %}
      {% for message in messages %}
        <div class="error-banner">{{ message }}</div>
      {% endfor %}
    {% endif %}

    <form method="post">
      {% csrf_token %}
      <div class="field">
        <label for="email">Email address</label>
        <input type="email" id="email" name="email" placeholder="name@example.com" required>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="name12345" required>
      </div>

      <div class="field">
        <label for="confirm_password">Confirm Password</label>
        <input type="password" id="confirm_password" name="confirm_password" placeholder="name12345" required>
      </div>

      <button type="submit" class="btn-primary">Create Account</button>
    </form>

    <p class="terms">
      By creating an account, you are agree to<br>
      <a href="#" onclick="return false;">Terms of Services</a> and <a href="#" onclick="return false;">Privacy Policy</a>.
    </p>

    <p class="footer-text">
      Already have an account? Sign in <a href="{% url 'login' %}">here!</a>
    </p>
  </div>
</body>
</html>
